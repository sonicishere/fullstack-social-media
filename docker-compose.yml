version: '3.8'
services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - ./data/db:/data/db
    ports:
      - "27017:27017"

  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - mongo
    volumes:
      - ./server:/app

  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - server
