<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Connectify - A stunning social media platform built with React" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Initialize theme early to avoid flash of wrong theme on reload
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          if (!saved) {
            // default to light when no saved theme to avoid unexpected dark UI
            saved = 'light';
          }
          document.documentElement.dataset.theme = saved;
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <title>Connectify - Social Media Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Load bootstrap JS bundle for dropdowns -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
